# Optional: put the web inbox behind nginx on mail.your-domain.com
# Install nginx, copy this to /etc/nginx/sites-available/tempmail,
# replace VPS_IP / domain as needed, then:
#   sudo ln -s /etc/nginx/sites-available/tempmail /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Add basic auth if you want it public but private:
#   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.htpasswd user
server {
    listen 80;
    server_name mail.your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # auth_basic "Temp mail"; auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
# For HTTPS, run: sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d mail.your-domain.com
